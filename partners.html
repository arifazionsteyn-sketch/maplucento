<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUCENTO — Сеть партнёров</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d0a12;--line:rgba(212,168,90,.22);--gold:#d4a85a;--gold-hi:#e9c67e;--gold-dk:#a8823f;--wine:#6b2233;--text:#f0e2d0;--muted:#b39c8a;--ink:#2a1218;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden;background:radial-gradient(900px 640px at 80% 45%,rgba(107,34,51,.5),transparent 65%),radial-gradient(700px 500px at 0 0,rgba(212,168,90,.07),transparent 60%),var(--bg)}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header,main,footer{position:relative;z-index:1}
header{display:flex;justify-content:space-between;align-items:center;padding:26px 5vw}
.logo{font-family:'Cormorant Garamond',serif;font-size:26px;letter-spacing:.14em;color:var(--gold);text-decoration:none}
.lang{display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--line);background:rgba(29,10,18,.7)}
.lang button{border:0;background:none;color:var(--muted);font:700 11.5px 'Manrope',sans-serif;letter-spacing:.04em;padding:7px 12px;border-radius:999px;cursor:pointer;transition:color .2s}
.lang button:hover{color:var(--gold-hi)}
.lang button.on{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:4vw;align-items:center;max-width:1500px;margin:0 auto;padding:2vh 5vw 8vh;min-height:calc(100vh - 150px)}
.eyebrow{display:flex;align-items:center;gap:14px;color:var(--gold-dk);font-weight:600;font-size:12.5px;letter-spacing:.22em;text-transform:uppercase}
.eyebrow::before{content:"";width:44px;height:1px;background:var(--gold-dk)}
h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(42px,5.6vw,84px);line-height:1.03;letter-spacing:-.01em;margin:22px 0 24px}
h1 em{font-style:italic;color:var(--gold-hi)}
.lead{max-width:520px;margin:0;color:var(--muted);font-size:17px;line-height:1.75}
.cta{position:relative;display:inline-flex;align-items:center;gap:16px;margin-top:40px;padding:20px 34px;border-radius:999px;border:1px solid var(--gold);overflow:hidden;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,var(--gold-dk));color:var(--ink);font:700 15px 'Manrope',sans-serif;letter-spacing:.03em;text-decoration:none;
  box-shadow:0 14px 40px rgba(212,168,90,.18),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .25s,box-shadow .25s}
.cta::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg)}
.cta:hover::after{left:130%;transition:left .8s ease}
.cta:hover{box-shadow:0 18px 50px rgba(212,168,90,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.cta:active{transform:translateY(1px)}
.cta:focus-visible{outline:2px solid var(--gold-hi);outline-offset:4px}
.cta svg{transition:transform .25s}.cta:hover svg{transform:translateX(5px)}
.hint{margin:16px 0 0 6px;color:var(--muted);font-size:13px;opacity:.8}
.stats{display:flex;flex-wrap:wrap;gap:20px 52px;margin-top:56px;padding-top:28px;border-top:1px solid var(--line);max-width:560px}
.stats b{display:block;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:48px;line-height:1;color:var(--gold-hi)}
.stats span{display:block;margin-top:8px;color:var(--muted);font-size:13px}
.vis{position:relative}
.vis::before{content:"";position:absolute;left:50%;top:50%;width:112%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:1px solid var(--line);box-shadow:0 0 0 70px rgba(212,168,90,.02),0 0 0 71px rgba(212,168,90,.1)}
.vis svg{position:relative;display:block;width:100%;height:auto;overflow:visible}
.uz{fill:rgba(212,168,90,.07);stroke:var(--gold);stroke-width:1.1;vector-effect:non-scaling-stroke;stroke-linejoin:round;filter:drop-shadow(0 0 14px rgba(212,168,90,.35))}
.dot{fill:var(--gold-hi)}
.halo{fill:none;stroke:var(--gold-hi);stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:pl 3.2s ease-out infinite}
@keyframes pl{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}
footer{padding:24px 5vw;color:var(--muted);font-size:12.5px;opacity:.7}
@media(max-width:900px){main{grid-template-columns:1fr;padding-bottom:6vh}.vis{order:-1;max-width:520px}.vis::before{display:none}.cta{width:100%;justify-content:center;padding:19px 24px}}
/* заставка перехода */
#intro{position:fixed;inset:0;z-index:50;display:none;background:#0d0307}
#intro.on{display:block}
#cv{position:absolute;inset:0;width:100%;height:100%}
#isvg{position:absolute;inset:0;width:100%;height:100%}
#iuz{fill:rgba(212,168,90,0);stroke:var(--gold-hi);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round;filter:drop-shadow(0 0 12px rgba(233,198,126,.7))}
#skip{position:absolute;right:5vw;bottom:5vh;border:1px solid var(--line);background:rgba(29,10,18,.6);color:var(--muted);font:600 12.5px 'Manrope',sans-serif;padding:9px 16px;border-radius:999px;cursor:pointer}
#skip:hover{color:var(--gold-hi);border-color:var(--gold-dk)}
#fade{position:absolute;inset:0;background:var(--bg);opacity:0}
</style>
</head>

      for(var l=-3;l<=3;l++){var la=l*Math.PI/9,ry=R*Math.cos(la);ctx.beginPath();ctx.ellipse(cx,cy+R*Math.sin(la),ry,ry*.14,0,0,6.283);ctx.stroke()}
      ctx.restore();
      ctx.strokeStyle='rgba(233,198,126,'+.7*(1-z)+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,R,0,6.283);ctx.stroke();
      /* точка-цель */
      var px=cx+p.x*R,py=cy+p.y*R,pu=(t/700)%1,pa=(1-sm(2800,3400,t));
      ctx.fillStyle='rgba(233,198,126,'+pa+')';ctx.beginPath();ctx.arc(px,py,4,0,6.283);ctx.fill();
      ctx.strokeStyle='rgba(233,198,126,'+(1-pu)*pa+')';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(px,py,6+pu*26,0,6.283);ctx.stroke();
      ctx.restore();
    }
    /* золотое свечение над страной по мере приближения */
    var gl=sm(2400,3800,t);if(gl>0){var q=ctx.createRadialGradient(sx,sy,0,sx,sy,Math.max(W,H)*.6);q.addColorStop(0,'rgba(212,168,90,'+.22*gl+')');q.addColorStop(1,'rgba(212,168,90,0)');ctx.fillStyle=q;ctx.fillRect(0,0,W,H)}
    /* 3. контур Узбекистана прорисовывается */
    var dr=sm(3100,4500,t);iuz.style.strokeDashoffset=PL*(1-dr);
    iuz.style.fill='rgba(212,168,90,'+(.12*sm(3900,4700,t))+')';
    ig.style.transformOrigin='50% 50%';ig.style.transform='scale('+(.9+.1*sm(3100,4800,t))+')';
    document.getElementById('isvg').style.opacity=sm(3000,3400,t);
    fade.style.opacity=sm(4600,5200,t);
    if(t>=DUR) leave(); else raf=requestAnimationFrame(frame);
  }
  cta.addEventListener('click',function(e){
    if(e.metaKey||e.ctrlKey||e.shiftKey||e.button!==0) return;
    e.preventDefault();
    if(matchMedia('(prefers-reduced-motion:reduce)').matches){leave();return}
    start();
  });
  skip.addEventListener('click',leave);
  addEventListener('keydown',function(e){if(e.key==='Escape'&&intro.classList.contains('on'))leave()});
  addEventListener('pageshow',function(e){if(e.persisted){cancelAnimationFrame(raf);go=false;intro.classList.remove('on');fade.style.opacity=0;document.body.style.overflow=''}});
})();
</script>
